# Substantive-law rules (v0). A law counts as substantive unless its instrument_type is in exclude_types or its
# title matches one of the regexes for its country's language. Matching is case-insensitive.
exclude_types: [ratification, consolidation, budget_law, other]

# language per country now lives in pipeline/common.py COUNTRIES[cc]['lang']

exclude_title_regex:
  en:
    - '^(Supply and )?Appropriation'
    - '^Consolidated Fund'
    - '^Finance( \(No\. ?\d\))? Act'
    - '^Central Fund'
    - 'Statute Law (Revision|Repeals)'
    - '\(Consolidation\)'
    - 'Consolidation Act'
    - 'ratification'
  es:
    - 'Presupuestos Generales del Estado'
    - 'cr[eé]dito extraordinario'
    - 'suplemento de cr[eé]dito'
    - 'Cuenta General del Estado'
  fr:
    - 'autorisant (la ratification|l.approbation|l.adh[eé]sion)'
    - '^(Loi )?(de|des) finances'
    - 'loi de finances'
    - 'loi de r[eè]glement'
    - "approbation des comptes"
    - 'financement de la s[eé]curit[eé] sociale'
    - 'journ[eé]e nationale'
  it:
    - '^Ratifica ed esecuzione'
    - 'ratifica'
    - 'Rendiconto generale'
    - 'Assestamento del bilancio'
    - 'Bilancio di previsione'
    - 'legge di (stabilit|bilancio)'
    - 'Giornata nazionale'
  nl:
    - 'goedkeuring van'
    - 'begrotingsstaat'
    - 'Slotwet'
    - 'suppletoire'
    - 'Rijkswet goedkeuring'
  de:
